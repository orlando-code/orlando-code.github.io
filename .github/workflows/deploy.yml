name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ICRS_EXPLORER_SRC: icrs-explorer
      CORAL_COVER_SRC: coral-cover-economics
      CENTRE_OF_MASS_SRC: centre-of-mass
    
    steps:
    - uses: actions/checkout@v4

    - name: Checkout ICRS explorer
      uses: actions/checkout@v4
      with:
        repository: orlando-code/explore-icrs-2026
        path: icrs-explorer
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout coral cover economics
      uses: actions/checkout@v4
      with:
        repository: orlando-code/coral-cover-economics
        path: coral-cover-economics
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout centre of mass
      uses: actions/checkout@v4
      with:
        repository: orlando-code/centre-of-mass
        path: centre-of-mass
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build static site
      run: npm run build
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./out
        force_orphan: true
